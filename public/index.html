<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotForge Administrator Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header class="topbar"><span class="brand"><span class="mark"></span> BotForge Admin</span><button class="theme-toggle" id="theme-toggle" type="button">Light mode</button></header>
<main class="page narrow"><h1>Administrator access</h1><p>Private control panel. Public registration is disabled.</p><div class="error-msg" id="error"></div><form id="login-form"><div class="field"><label for="email">Administrator email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-block" type="submit">Secure sign in</button></form><p class="muted" style="margin-top:18px">Three incorrect password attempts lock the administrator account. Password recovery requires server-side access.</p></main>
<script src="/js/api.js"></script><script>
const themeKey='botforge-admin-theme';function setTheme(t){document.documentElement.dataset.theme=t;document.getElementById('theme-toggle').textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem(themeKey,t)}catch(_){}}let theme='dark';try{theme=localStorage.getItem(themeKey)||'dark'}catch(_){}setTheme(theme);document.getElementById('theme-toggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
const errorBox=document.getElementById('error');document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();errorBox.classList.remove('show');try{await api('/auth/login',{method:'POST',body:{email:document.getElementById('email').value,password:document.getElementById('password').value}});location.href='/admin.html'}catch(err){errorBox.textContent=err.message;errorBox.classList.add('show')}});api('/auth/me').then(()=>location.href='/admin.html').catch(()=>{});
</script></body></html>
