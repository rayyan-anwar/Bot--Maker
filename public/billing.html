<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotForge Plans</title><link rel="stylesheet" href="/css/style.css"><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:radial-gradient(ellipse at top,#172344,#0b1020 60%);min-height:100vh}.wrap{max-width:960px;margin:auto}.muted{color:#9eabc7}.top{margin-bottom:28px}.top a{color:#9db6ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#121a2e;border:1px solid #263451;border-radius:16px;padding:22px}.card h2{margin:0 0 8px}.quota{font-size:26px;font-weight:750;margin:20px 0 4px}.button{border:0;border-radius:9px;padding:11px 15px;background:#345de0;color:white;font:inherit;font-weight:650;cursor:pointer;width:100%}.button:disabled{opacity:.55;cursor:wait}.current{border-color:#5d7df1}.status{margin:18px 0;color:#a8c2ff}.note{font-size:13px;line-height:1.6;color:#9eabc7;margin-top:20px}

:root{font-family:var(--font-body);background:var(--bg);color:var(--text)}
body{padding:clamp(20px,5vw,56px) 18px;background:radial-gradient(ellipse at 12% 0%,rgba(139,124,255,.16),transparent 38%),var(--bg);color:var(--text)}
.wrap{max-width:1040px}.top{padding:24px 0 28px;border-bottom:1px solid var(--border);margin-bottom:26px}
.top h1{font:600 clamp(2rem,4vw,2.8rem) var(--font-head);letter-spacing:-.04em}.top a{color:var(--accent-2);font-weight:600}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:clamp(20px,3vw,28px);box-shadow:var(--shadow-card);transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}.card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-card)}
.card h2{font:600 1.2rem var(--font-head);letter-spacing:-.025em}.quota{font:700 2.2rem var(--font-head);letter-spacing:-.05em;color:var(--text)}
.button{background:linear-gradient(135deg,var(--accent),#6d8cff);border-radius:11px;min-height:44px;box-shadow:0 8px 22px rgba(98,84,220,.22);transition:transform .16s ease,filter .16s ease}
.button:hover{filter:brightness(1.08);transform:translateY(-1px)}.status{color:var(--accent-2);font-weight:600}
.note{border-top:1px solid var(--border);padding-top:18px}#theme-toggle{float:right;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font:600 .85rem var(--font-body)}
@media(max-width:560px){body{padding:18px 14px}.top{padding-top:10px}.card{padding:20px}.quota{font-size:1.9rem}}
</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/images/botforge-icon.svg" type="image/svg+xml"><meta name="theme-color" content="#101827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BotForge"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><main class="wrap"><header class="top"><button id="theme-toggle" type="button">Switch theme</button><h1>BotForge plans</h1><p class="muted">Choose the usage level that fits your work.</p><a href="/dashboard.html">Back to dashboard</a></header><div id="status" class="status">Loading plans…</div><section id="plans" class="grid"></section><p class="note">Paid checkout is handled securely by the payment provider. Prices and payment methods are configured by the service operator. Plan changes take effect after the payment provider confirms the subscription.</p></main>
<script>
const root=document.getElementById('plans'),status=document.getElementById('status');async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},...options});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw new Error(data.error||'Request failed');return data}
async function load(){try{const data=await api('/api/billing/plans');root.replaceChildren();for(const [name,plan] of Object.entries(data.plans)){const card=document.createElement('article');card.className='card'+(name===data.currentPlan?' current':'');const title=document.createElement('h2');title.textContent=name.toUpperCase();const detail=document.createElement('p');detail.className='muted';detail.textContent=name===data.currentPlan?'Your current plan':'Plan option';const quota=document.createElement('div');quota.className='quota';quota.textContent=Number(plan.dailyMessages).toLocaleString();const unit=document.createElement('div');unit.className='muted';unit.textContent='messages per day';card.append(title,detail,quota,unit);if(name!=='free'&&name!==data.currentPlan){const button=document.createElement('button');button.className='button';button.style.marginTop='20px';button.textContent='Continue to secure checkout';button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Creating secure checkout…';try{const session=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({plan:name})});location.href=session.checkoutUrl}catch(e){status.textContent=e.message;button.disabled=false}});card.append(button)}root.append(card)}if(data.hasBillingCustomer){const portal=document.createElement('button');portal.className='button';portal.style.marginTop='18px';portal.textContent='Manage subscription and payment method';portal.addEventListener('click',async()=>{portal.disabled=true;try{const result=await api('/api/billing/portal',{method:'POST',body:JSON.stringify({})});location.href=result.portalUrl}catch(e){status.textContent=e.message;portal.disabled=false}});root.after(portal)}if(data.providers?.razorpay){const rzp=document.createElement('div');rzp.className='card';rzp.style.marginTop='18px';const heading=document.createElement('h2');heading.textContent='Pay with Razorpay';const copy=document.createElement('p');copy.className='muted';copy.textContent='UPI, cards and net banking are available where enabled on your Razorpay account.';const select=document.createElement('select');select.id='rzp-plan';select.style.cssText='width:100%;padding:10px;border-radius:8px;margin:8px 0';for(const n of ['plus','pro'])if(data.plans[n]){const option=document.createElement('option');option.value=n;option.textContent=n.toUpperCase();select.append(option)}const pay=document.createElement('button');pay.className='button';pay.textContent='Subscribe with Razorpay';pay.disabled=data.currentPlan!=='free';pay.addEventListener('click',async()=>{pay.disabled=true;try{const session=await api('/api/billing/razorpay/checkout',{method:'POST',body:JSON.stringify({plan:select.value})});location.href=session.checkoutUrl}catch(e){status.textContent=e.message;pay.disabled=false}});rzp.append(heading,copy,select,pay);root.after(rzp)}status.textContent='Current plan: '+data.currentPlan.toUpperCase()}catch(e){status.textContent=e.message}}
load();
(function(){
 const root=document.documentElement;let saved=null;
 try{saved=localStorage.getItem('botforge-theme')}catch(_){}
 const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
 function apply(theme){root.dataset.theme=theme;document.getElementById('theme-toggle').textContent=theme==='dark'?'Light mode':'Dark mode'}
 apply(saved||(dark?'dark':'light'));
 document.getElementById('theme-toggle').addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';apply(next);try{localStorage.setItem('botforge-theme',next)}catch(_){}});
})();

</script><script>if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
