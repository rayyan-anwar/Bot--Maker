<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BotForge Plans</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:radial-gradient(ellipse at top,#172344,#0b1020 60%);min-height:100vh}.wrap{max-width:960px;margin:auto}.muted{color:#9eabc7}.top{margin-bottom:28px}.top a{color:#9db6ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#121a2e;border:1px solid #263451;border-radius:16px;padding:22px}.card h2{margin:0 0 8px}.quota{font-size:26px;font-weight:750;margin:20px 0 4px}.button{border:0;border-radius:9px;padding:11px 15px;background:#345de0;color:white;font:inherit;font-weight:650;cursor:pointer;width:100%}.button:disabled{opacity:.55;cursor:wait}.current{border-color:#5d7df1}.status{margin:18px 0;color:#a8c2ff}.note{font-size:13px;line-height:1.6;color:#9eabc7;margin-top:20px}
</style></head><body><main class="wrap"><header class="top"><h1>BotForge plans</h1><p class="muted">Choose the usage level that fits your work.</p><a href="/dashboard.html">Back to dashboard</a></header><div id="status" class="status">Loading plans…</div><section id="plans" class="grid"></section><p class="note">Paid checkout is handled securely by the payment provider. Prices and payment methods are configured by the service operator. Plan changes take effect after the payment provider confirms the subscription.</p></main>
<script>
const root=document.getElementById('plans'),status=document.getElementById('status');async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},...options});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw new Error(data.error||'Request failed');return data}
async function load(){try{const data=await api('/api/billing/plans');root.replaceChildren();for(const [name,plan] of Object.entries(data.plans)){const card=document.createElement('article');card.className='card'+(name===data.currentPlan?' current':'');const title=document.createElement('h2');title.textContent=name.toUpperCase();const detail=document.createElement('p');detail.className='muted';detail.textContent=name===data.currentPlan?'Your current plan':'Plan option';const quota=document.createElement('div');quota.className='quota';quota.textContent=Number(plan.dailyMessages).toLocaleString();const unit=document.createElement('div');unit.className='muted';unit.textContent='messages per day';card.append(title,detail,quota,unit);if(name!=='free'&&name!==data.currentPlan){const button=document.createElement('button');button.className='button';button.style.marginTop='20px';button.textContent='Continue to secure checkout';button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Creating secure checkout…';try{const session=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({plan:name})});location.href=session.checkoutUrl}catch(e){status.textContent=e.message;button.disabled=false}});card.append(button)}root.append(card)}status.textContent='Current plan: '+data.currentPlan.toUpperCase()}catch(e){status.textContent=e.message}}
load();
</script></body></html>
