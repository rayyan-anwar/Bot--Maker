<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · BotForge</title><link rel="stylesheet" href="/css/style.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}main{width:min(100%,460px);padding:30px;background:var(--surface);border:1px solid var(--border);border-radius:18px}h1{margin-top:0}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text)}button{margin-top:18px;width:100%}#reset-form[hidden],#request-form[hidden]{display:none}.muted{line-height:1.6}
</style><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/images/botforge-icon.svg" type="image/svg+xml"><meta name="theme-color" content="#101827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BotForge"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><main><a href="/">← BotForge</a><h1>Reset your password</h1><p class="muted">Request a one-time reset link, or set a new password using the link sent to your email. Links expire after 20 minutes.</p><p id="status" role="status" class="muted"></p><form id="request-form"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required><button class="btn btn-primary" type="submit">Send reset link</button></form><form id="reset-form" hidden><label for="password">New password</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button class="btn btn-primary" type="submit">Save new password</button></form></main><script>
const statusEl=document.getElementById('status'),requestForm=document.getElementById('request-form'),resetForm=document.getElementById('reset-form'),token=new URLSearchParams(location.search).get('token');if(token){history.replaceState(null,document.title,location.pathname);requestForm.hidden=true;resetForm.hidden=false}async function send(path,body){const r=await fetch('/api/auth/password/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}requestForm.onsubmit=async e=>{e.preventDefault();try{const r=await send('forgot',{email:document.getElementById('email').value});statusEl.textContent=r.message}catch(err){statusEl.textContent=err.message}};resetForm.onsubmit=async e=>{e.preventDefault();try{const r=await send('reset',{token,password:document.getElementById('password').value});statusEl.textContent=r.message+' Redirecting to sign in…';setTimeout(()=>location.href='/',1500)}catch(err){statusEl.textContent=err.message}};
</script><script>if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
