name: BotForge live staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botforge-live-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify live staging readiness and proxy headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require staging URL secret
        env:
          BOTFORGE_STAGING_URL: ${{ secrets.BOTFORGE_STAGING_URL }}
        run: |
          if [ -z "$BOTFORGE_STAGING_URL" ]; then
            echo "::error::Add BOTFORGE_STAGING_URL as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check live staging health, PostgreSQL readiness and proxy headers
        env:
          BOTFORGE_STAGING_URL: ${{ secrets.BOTFORGE_STAGING_URL }}
        run: npm run staging:smoke
