name: Full Chat Browser E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - '.github/workflows/full-chat-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-chat-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full signup-to-chat browser test
        run: npx playwright test --config=playwright.config.cjs tests/browser/chat-flow.spec.cjs
