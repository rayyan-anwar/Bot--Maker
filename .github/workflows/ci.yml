name: BotForge CI
on:
  push:
    branches: [main, work/part2-security-reliability-main]
  pull_request:
    branches: [main]

# A branch update already triggers the open pull_request workflow. Avoid a second
# run for the same commit and cancel stale runs when newer commits arrive.
concurrency:
  group: botforge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    permissions:
      contents: read
    name: Node.js ${{ matrix.node-version }} verification
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node scripts/check-syntax.js
      - run: npm run security:scan
      - run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botforge_test
          POSTGRES_USER: botforge
          POSTGRES_PASSWORD: botforge_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botforge -d botforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Apply baseline and runtime migrations
        env:
          BOTFORGE_TEST_DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_test
        run: node scripts/apply-test-migrations.js
      - name: Exercise PostgreSQL concurrency and shared rate limits
        env:
          BOTFORGE_TEST_DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_test
        run: node --test tests/postgres.integration.test.js
      - name: Exercise PostgreSQL AI budget ledger lifecycle and idempotency
        env:
          BOTFORGE_TEST_DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_test
        run: node --test tests/postgres-ai-budget-ledger.test.js
      - name: Exercise PostgreSQL Social OAuth state atomicity
        env:
          BOTFORGE_TEST_DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_test
        run: node --test tests/postgres-social-oauth.test.js
      - name: Rehearse PostgreSQL backup and restore on disposable databases
        env:
          DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_test
          RESTORE_DATABASE_URL: postgres://botforge:botforge_test_password@127.0.0.1:5432/botforge_restore_test
          BOTFORGE_BACKUP_DIR: ${{ runner.temp }}/botforge-backups
        run: |
          mkdir -p "$BOTFORGE_BACKUP_DIR"
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e RESTORE_DATABASE_URL="$RESTORE_DATABASE_URL" \
            -e BOTFORGE_BACKUP_DIR=/backups \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$BOTFORGE_BACKUP_DIR:/backups" \
            -w /workspace postgres:16 bash -euo pipefail -c '
              bash scripts/backup-postgres.sh
              BACKUP_FILE="$(find /backups -maxdepth 1 -type f -name "botforge-*.dump" -print -quit)"
              test -n "$BACKUP_FILE"
              createdb --maintenance-db="$DATABASE_URL" botforge_restore_test
              DATABASE_URL="$RESTORE_DATABASE_URL" BACKUP_FILE="$BACKUP_FILE" CONFIRM_RESTORE=YES bash scripts/restore-postgres.sh
              test "$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT to_regclass('\''public.users'\'') IS NOT NULL")" = "t"
              test "$(psql "$RESTORE_DATABASE_URL" -Atc "SELECT to_regclass('\''public.bots'\'') IS NOT NULL")" = "t"
            '

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build production container image
        run: docker build --tag botforge:ci .
      - name: Smoke test container startup and readiness
        run: |
          docker run -d --rm --name botforge-ci -p 3000:3000 \
            -e JWT_SECRET=ci-only-dummy-secret-value-that-is-long-enough-12345 \
            -e BOTFORGE_ADMIN_EMAIL=admin@example.test botforge:ci
          trap 'docker stop botforge-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs botforge-ci
          exit 1
