# BotForge: zero-cost staging blueprint.
# Free Render PostgreSQL expires after 30 days and is not production storage.
# Upgrade only after reviewing the provider's current pricing and backup policy.
services:
  - type: web
    name: botforge-staging
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: botforge-staging-db
          property: connectionString
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: PG_POOL_MAX
        value: "5"
      - key: FREE_DAILY_MESSAGES
        value: "10"
      - key: MALWARE_SCAN_REQUIRED
        value: "true"
      - key: BOTFORGE_ADMIN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_MS
        value: "15000"
databases:
  - name: botforge-staging-db
    plan: free
    databaseName: botforge
    user: botforge
