# Local container smoke-test only. Use managed PostgreSQL and a managed secret store for production.
services:
  botforge:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or .env file}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      FREE_DAILY_MESSAGES: ${FREE_DAILY_MESSAGES:-30}
    volumes:
      - botforge-data:/app/data
      - botforge-uploads:/app/uploads
    restart: unless-stopped

volumes:
  botforge-data:
  botforge-uploads:
